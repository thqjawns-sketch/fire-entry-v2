name: Apply V2.51-R4 integrated safety management

on:
  push:
    branches: [ main ]
    paths:
      - '.github/scripts/patch_v251r4.py'
      - '.github/workflows/apply-v251r4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch index
        run: python .github/scripts/patch_v251r4.py
      - name: Validate version
        run: |
          grep -q 'V2.51-R4' index.html
          grep -q '🛡️ 조 안전관리' index.html
          grep -q '🛡️ 개별 안전관리' index.html
          grep -q '⏳ 반영중...' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Apply V2.51-R4 integrated safety management UI'
            git push
          fi
