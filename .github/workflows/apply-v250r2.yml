name: Apply V2.50-R2 test patch

on:
  push:
    branches:
      - v2.50-r2-test

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: v2.50-r2-test
          fetch-depth: 0

      - name: Apply verified V2.50-R2 patch
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'QR기반-진·출입 안전관리앱 V2.50-R2' index.html; then
            echo 'V2.50-R2 already applied.'
            exit 0
          fi
          git apply --check .v250r2.patch
          git apply .v250r2.patch
          grep -q 'QR기반-진·출입 안전관리앱 V2.50-R2' index.html
          rm -f .v250r2.patch .github/workflows/apply-v250r2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Apply V2.50-R2 index changes'
          git push origin HEAD:v2.50-r2-test
