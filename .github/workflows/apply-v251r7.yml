name: Apply V2.51-R7 combined confirmation summary
on:
  push:
    paths:
      - '.github/workflows/apply-v251r7.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/patch_v251r7.py
      - name: Validate markers
        run: |
          grep -q 'V2.51-R7' index.html
          grep -q '31분 이상 또는 고립대원 확인대상 0명' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Apply V2.51-R7 combined confirmation summary'
          git push
