name: Apply V2.51-R5 commander cleanup

on:
  push:
    paths:
      - '.github/scripts/patch_v251r5.py'
      - '.github/workflows/apply-v251r5.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/patch_v251r5.py
      - name: Commit
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Apply V2.51-R5 safety visibility and commander cleanup"
          git push origin main
