name: Apply V2.51-R2 action-name hotfix
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/apply-v251r2.yml'
      - '.github/scripts/patch_v251r2_action_names.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: python .github/scripts/patch_v251r2_action_names.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Apply V2.51-R2 action-name hotfix"
          git push
