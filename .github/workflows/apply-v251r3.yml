name: Apply V2.51-R3 speed refresh blink patch

on:
  push:
    paths:
      - '.github/workflows/apply-v251r3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: python .github/scripts/patch_v251r3.py
      - name: Validate markers
        run: |
          grep -q 'V2.51-R3' index.html
          grep -q '10000;' index.html
          grep -q '10초 자동갱신' index.html
          grep -q 'setIsolationBatch' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Apply V2.51-R3 speed refresh blink improvements'
          git push
