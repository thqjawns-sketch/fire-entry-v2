name: Apply V2.50-R6 clean commander board
on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/apply-v250r6.yml' ]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch commander board
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if 'V2.50-R5' not in s:
              raise SystemExit('Expected V2.50-R5 not found')
          s=s.replace('V2.50-R5','V2.50-R6')

          css_anchor='@media(max-width:620px){.v250CommanderTeamsGrid{grid-template-columns:1fr}}'
          css_extra='''
/* ===== V2.50-R6 지휘관 관제판 정리 ===== */
.v250CommanderSectionTitle{margin:6px 0 10px;font-size:20px;font-weight:950;color:#173d67;letter-spacing:-.3px}
.v250CommanderTeamsHead>span:first-child{font-size:20px!important;font-weight:950!important;color:#173d67}
.v250CommanderTeamsSub{font-size:17px!important;font-weight:950!important;color:#173d67!important}
.v250CommanderTeamsGrid{display:flex!important;flex-direction:column!important;gap:9px!important}
.v250CommanderTeamCard{width:100%;box-sizing:border-box;display:grid!important;grid-template-columns:155px minmax(260px,1.15fr) 235px minmax(390px,1.7fr);align-items:center;gap:12px;padding:11px 14px!important}
.v250CommanderTeamTop{margin:0!important}
.v250CommanderTeamLoc,.v250CommanderTeamMeta,.v250CommanderMembers{margin:0!important}
.v250CommanderMembers{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.v250CommanderMember{font-size:12px;padding:6px 8px}
.v250CommanderTeamMeta{display:flex;flex-wrap:wrap;gap:6px}
.v250CommanderTeamCard .v250CommanderTeamName{font-size:18px}
.v250CommanderTeamCard .v250CommanderTeamCount{font-size:14px}
.v250BoardVisualTitle{margin:0 0 10px;font-size:19px;font-weight:950;color:#173d67}
@media(max-width:1100px){.v250CommanderTeamCard{grid-template-columns:140px 1fr 200px}.v250CommanderMembers{grid-column:1/-1}}
@media(max-width:760px){.v250CommanderTeamCard{grid-template-columns:1fr}.v250CommanderTeamLoc,.v250CommanderTeamMeta,.v250CommanderMembers{grid-column:1}}
'''
          if css_anchor not in s:
              raise SystemExit('CSS anchor missing')
          s=s.replace(css_anchor,css_anchor+css_extra,1)

          html_anchor='''<div class="v250CommanderPanel">\n  <div id="v29BoardSite" class="v250CommanderSite">현장 : -</div>\n  <div id="v250BoardLiveSummary" class="v250CommanderMetrics"></div>'''
          html_new='''<div class="v250CommanderPanel">\n  <div id="v29BoardSite" class="v250CommanderSite">현장 : -</div>\n  <div class="v250CommanderSectionTitle">👥 인원현황</div>\n  <div id="v250BoardLiveSummary" class="v250CommanderMetrics"></div>'''
          if html_anchor not in s:
              raise SystemExit('Commander HTML anchor missing')
          s=s.replace(html_anchor,html_new,1)

          card_anchor='''<div class="v29BoardCard">\n    <div class="v33BoardCardScroll">'''
          card_new='''<div class="v29BoardCard">\n    <div class="v250BoardVisualTitle">🗺️ 위치 관제</div>\n    <div class="v33BoardCardScroll">'''
          if card_anchor not in s:
              raise SystemExit('Board card anchor missing')
          s=s.replace(card_anchor,card_new,1)

          duplicate_block='''\n    <div id="v29BoardDetail" class="v29BoardDetail">\n      <div class="v29DetailEmpty">조를 누르면 현재 위치 상세정보가 표시됩니다.</div>\n    </div>\n\n    <div id="v34FloorMembers" class="v34FloorMembers">\n      <div class="v34FloorMembersHead">선택 층 활동대원</div>\n      <div class="v34FloorMemberEmpty">층을 선택하면 해당 층의 활동대원이 표시됩니다.</div>\n    </div>\n\n    <div id="v33BoardStats" class="v33BoardStats"></div>\n\n    <div class="v29BoardFoot">\n      ※ 층을 선택하면 해당 층의 현재 활동 조와 대원을 확인할 수 있습니다. 방면은 아래쪽 A방면을 기준으로 시계방향 B → C → D 순서입니다.\n    </div>\n'''
          if duplicate_block not in s:
              raise SystemExit('Duplicate board block missing')
          s=s.replace(duplicate_block,'\n',1)

          old_init='if(!gm.has(key))gm.set(key,{team,activityNo,direction:m.direction||"미지정",floor:m.floor||"미지정",detail:m.detail||"세부장소 미지정",members:[],maxMinutes:0,isolated:false});'
          new_init='if(!gm.has(key))gm.set(key,{team,activityNo,direction:m.direction||"미지정",floor:m.floor||"미지정",detail:m.detail||"세부장소 미지정",entryTime:m.entryTime||"",members:[],maxMinutes:0,isolated:false});'
          if old_init not in s:
              raise SystemExit('Group init missing')
          s=s.replace(old_init,new_init,1)

          add_member='''      g.members.push({id:m.memberId,name:m.memberName||m.name||"",mins,isolated:!!m.isolated});\n      if((!g.detail || g.detail==="세부장소 미지정") && m.detail)g.detail=m.detail;'''
          add_member_new='''      g.members.push({id:m.memberId,name:m.memberName||m.name||"",mins,isolated:!!m.isolated});\n      if(m.entryTime && (!g.entryTime || String(m.entryTime)<String(g.entryTime)))g.entryTime=m.entryTime;\n      if((!g.detail || g.detail==="세부장소 미지정") && m.detail)g.detail=m.detail;'''
          if add_member not in s:
              raise SystemExit('Member grouping block missing')
          s=s.replace(add_member,add_member_new,1)

          old_sort='''    const groups=[...gm.values()].sort((a,b)=>{\n      const na=parseInt(String(a.team).match(/\\d+/)?.[0]||"999",10), nb=parseInt(String(b.team).match(/\\d+/)?.[0]||"999",10);\n      return na-nb || a.activityNo-b.activityNo || String(a.team).localeCompare(String(b.team),"ko");\n    });'''
          new_sort='''    const groups=[...gm.values()].sort((a,b)=>{\n      const ta=String(a.entryTime||"9999-99-99 99:99:99"), tb=String(b.entryTime||"9999-99-99 99:99:99");\n      const byEntry=ta.localeCompare(tb);\n      if(byEntry!==0)return byEntry;\n      const na=parseInt(String(a.team).match(/\\d+/)?.[0]||"999",10), nb=parseInt(String(b.team).match(/\\d+/)?.[0]||"999",10);\n      return na-nb || a.activityNo-b.activityNo || String(a.team).localeCompare(String(b.team),"ko");\n    });'''
          if old_sort not in s:
              raise SystemExit('Team sort block missing')
          s=s.replace(old_sort,new_sort,1)

          toggle_anchor='''async function v250ToggleIsolation(memberId,memberName){\n  const m=(window.__dashboardInsideMembers||[]).find(x=>String(x.memberId)===String(memberId)); if(!m)return;'''
          toggle_new='''async function v250ToggleIsolation(memberId,memberName){\n  const boardPage=document.getElementById("teamBoardPageV29");\n  if(boardPage && getComputedStyle(boardPage).display!=="none")return;\n  const m=(window.__dashboardInsideMembers||[]).find(x=>String(x.memberId)===String(memberId)); if(!m)return;'''
          if toggle_anchor not in s:
              raise SystemExit('Isolation guard anchor missing')
          s=s.replace(toggle_anchor,toggle_new,1)

          p.write_text(s,encoding='utf-8')
      - name: Validate
        run: |
          grep -q 'V2.50-R6' index.html
          grep -q '👥 인원현황' index.html
          grep -q '🗺️ 위치 관제' index.html
          grep -q 'v250CommanderTeamsSub{font-size:17px' index.html
          ! grep -q '층을 선택하면 해당 층의 활동대원이 표시됩니다' index.html
          git diff --check
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Apply V2.50-R6 clean commander board' || exit 0
          git push origin HEAD:main
