name: Apply V2.50-R4 commander summary
on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/apply-v250r4.yml' ]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch index
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('V2.50-R3','V2.50-R4')
          anchor='#v250BoardRefreshInfo{margin-top:7px!important;text-align:right!important;color:#66788a!important;opacity:1!important}\n'
          extra='''.v250TeamSummaryRow{grid-column:1/-1;display:flex;align-items:center;gap:10px;margin-top:1px;padding:8px 10px;border-radius:9px;background:#eef4fa;color:#29435f;font-size:13px;font-weight:900;overflow:hidden}\n.v250TeamSummaryLabel{flex:0 0 auto;color:#173d67;font-weight:950}\n.v250TeamSummaryList{display:flex;gap:8px;align-items:center;overflow-x:auto;white-space:nowrap;scrollbar-width:thin}\n.v250TeamChip{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border:1px solid #d6e1ec;border-radius:999px;background:#fff;color:#173d67}\n.v250TeamChip strong{font-size:13px}.v250TeamChip.isolated{border-color:#d93025;background:#fff1f0;color:#b42318}.v29BoardRefresh.isLoading{opacity:.75;cursor:wait}\n'''
          if extra not in s:
            if anchor not in s: raise SystemExit('CSS anchor not found')
            s=s.replace(anchor,anchor+extra,1)
          mark='  if(sum)sum.innerHTML=\n'
          insert='''  const teams=v29GroupTeams(list);\n  const teamText=teams.length?teams.map(t=>'<span class="v250TeamChip '+(t.isolated?'isolated':'')+'">'+(t.isolated?'🚨 ':'')+'<strong>'+escapeHtml(t.team)+'</strong> '+t.count+'명 · '+escapeHtml(t.direction||'미지정')+' · '+escapeHtml(t.floor||'미지정')+' · '+Number(t.minutes||0)+'분</span>').join(''):'<span class="v250TeamChip">활동 중인 조 없음</span>';\n'''
          if insert not in s:
            if mark not in s: raise SystemExit('summary mark not found')
            s=s.replace(mark,insert+mark,1)
          old='''    '<div class="v250FloorSummary" style="grid-column:1/-1">층별 현재 인원 · '+(floorText||"활동대원 없음")+'</div>';\n'''
          new='''    '<div class="v250FloorSummary" style="grid-column:1/-1">층별 현재 인원 · '+(floorText||"활동대원 없음")+'</div>'+\n    '<div class="v250TeamSummaryRow"><span class="v250TeamSummaryLabel">조별현황</span><div class="v250TeamSummaryList">'+teamText+'</div></div>';\n'''
          if new not in s:
            if old not in s: raise SystemExit('floor row not found')
            s=s.replace(old,new,1)
          old2='''async function refreshTeamBoardV29(){\n  // 기존 안정화된 현황 조회 함수를 그대로 사용\n  await loadDashboard(false);\n  // loadDashboard가 dashboardPage 표시를 건드리지 않으므로 상태판을 다시 표시\n  const dashboard=document.getElementById("dashboardPage");\n  const board=document.getElementById("teamBoardPageV29");\n  if(dashboard)dashboard.style.display="none";\n  if(board)board.style.display="block";\n  drawTeamBoardV29();\n}\n'''
          new2='''async function refreshTeamBoardV29(){\n  const btn=document.querySelector("#teamBoardPageV29 .v29BoardRefresh");\n  const info=document.getElementById("v250BoardRefreshInfo");\n  const oldText=btn?btn.textContent:"";\n  if(btn){btn.disabled=true;btn.classList.add("isLoading");btn.textContent="⏳ 새로고침 중...";}\n  if(info)info.textContent="⏳ 현황 새로고침 중...";\n  try{\n    await loadDashboard(false);\n    const dashboard=document.getElementById("dashboardPage");\n    const board=document.getElementById("teamBoardPageV29");\n    if(dashboard)dashboard.style.display="none";\n    if(board)board.style.display="block";\n    drawTeamBoardV29();\n    v250UpdateBoardRefreshTime(new Date());\n  }catch(e){\n    if(info)info.textContent="⚠️ 새로고침 실패 · 기존 현황 유지";\n    alert((e&&e.message)||"현황 새로고침에 실패했습니다.");\n  }finally{\n    if(btn){btn.disabled=false;btn.classList.remove("isLoading");btn.textContent=oldText||"🔄 새로고침";}\n  }\n}\n'''
          if new2 not in s:
            if old2 not in s: raise SystemExit('refresh block not found')
            s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          rm -f .github/workflows/apply-v250r4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply V2.50-R4 commander summary" || exit 0
          git push
